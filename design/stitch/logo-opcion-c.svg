<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 48" width="160" height="48" fill="none">
  <!-- Isotipo Concepto C: La H de horario -->
  <g id="isotipo">
    <!-- Columna izquierda de la H -->
    <rect x="4" y="6" width="9" height="36" rx="4.5" fill="#F7F7F5"/>
    <!-- Columna derecha de la H -->
    <rect x="25" y="6" width="9" height="24" rx="4.5" fill="#F7F7F5"/>
    <!-- Travesaño / Conector lila -->
    <rect x="11" y="20" width="16" height="8" rx="4" fill="#C4B5FD"/>
    <!-- Bloque de acento crema (#F2E6A9) anclando la base temporal derecha -->
    <rect x="25" y="34" width="9" height="8" rx="4" fill="#F2E6A9"/>
  </g>
  <!-- Wordmark Hourly -->
  <text x="46" y="31" font-family="Inter, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#F7F7F5" letter-spacing="-0.02em">Hourly<tspan fill="#C4B5FD">.</tspan></text>
</svg>