[project]
name = "hourly-api"
version = "0.1.0"
description = "Hourly API — generador y validador de horarios escolares"
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    # Importación de Excel: openpyxl solo, sin pandas (D-016).
    "openpyxl>=3.1",
    # UploadFile multipart del endpoint POST /api/importaciones.
    "python-multipart>=0.0.9",
    # Solver CP-SAT (app/solver, fase 4).
    "ortools>=9.11",
    "openai>=1.55",
    "reportlab>=4.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.8",
]

# Proyecto "virtual": la app corre desde api/ sin instalarse como paquete.
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
