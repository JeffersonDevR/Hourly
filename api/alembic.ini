[alembic]
script_location = alembic
prepend_sys_path = .
# Separador de `prepend_sys_path`/`version_path` explícito: sin esto Alembic 1.16+
# avisa en cada corrida que cae al splitting legacy por espacios y comas.
path_separator = os
version_path_separator = os
# La URL real la inyecta alembic/env.py desde `app.config.Settings.database_url`.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
